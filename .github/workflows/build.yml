name: Build Neon Rift Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create the 3D game project
        shell: bash
        run: |
          mkdir -p www
          cat > package.json <<'EOF'
          {
            "name": "neon-rift",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": { "build": "vite build" },
            "dependencies": {
              "@capacitor/android": "^6.2.1",
              "@capacitor/core": "^6.2.1",
              "three": "^0.169.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.1",
              "vite": "^5.4.10"
            }
          }
          EOF

          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
            <meta name="theme-color" content="#050713">
            <title>NEON RIFT</title>
          </head>
          <body>
            <div id="app">
              <div id="hud">
                <div class="brand">NEON <b>RIFT</b><small>SECTOR 07 // SURVIVAL</small></div>
                <div class="stats"><span>CORE <b id="health">100</b></span><span>WAVE <b id="wave">01</b></span><span>SCORE <b id="score">0000</b></span></div>
              </div>
              <div id="center">
                <div class="eyebrow">NEURAL LINK ESTABLISHED</div>
                <h1>ENTER THE<br><em>RIFT</em></h1>
                <p>Survive the sentry swarm. Keep moving.</p>
                <button id="start">INITIALIZE RUN</button>
                <div class="hint">LEFT STICK TO MOVE · RIGHT SIDE TO AIM & FIRE</div>
              </div>
              <div id="crosshair"><i></i><b></b></div>
              <div id="mobile">
                <div id="stick"><div id="nub"></div></div>
                <button id="fire">FIRE</button>
                <button id="dash">DASH</button>
              </div>
              <div id="toast"></div>
              <div id="gameover"><h2>SIGNAL LOST</h2><p id="finalscore"></p><button id="again">REBOOT</button></div>
            </div>
            <script type="module" src="/src/main.js"></script>
          </body>
          </html>
          EOF

          mkdir -p src
          cat > src/main.js <<'EOF'
          import * as THREE from 'three';
          import './style.css';

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x050713);
          scene.fog = new THREE.FogExp2(0x070b1b, 0.027);
          const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 180);
          camera.position.set(0, 4.8, 8.5);
          const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
          renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
          renderer.setSize(innerWidth, innerHeight);
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.25;
          document.querySelector('#app').prepend(renderer.domElement);

          scene.add(new THREE.HemisphereLight(0x9ebaff, 0x111326, 1.35));
          const key = new THREE.DirectionalLight(0x8bdcff, 2.2);
          key.position.set(-7, 13, 8); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); scene.add(key);
          const pinkLight = new THREE.PointLight(0xff2eaa, 26, 35); pinkLight.position.set(8, 5, -8); scene.add(pinkLight);
          const cyanLight = new THREE.PointLight(0x16d9ff, 30, 40); cyanLight.position.set(-9, 4, 5); scene.add(cyanLight);

          const mat = (color, metalness=0.35, roughness=0.35, emissive=0x000000, intensity=0) =>
            new THREE.MeshStandardMaterial({ color, metalness, roughness, emissive, emissiveIntensity: intensity });
          const floorMat = mat(0x111a2b, 0.65, 0.52);
          const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
          floor.rotation.x = -Math.PI/2; floor.position.y = -0.08; floor.receiveShadow = true; scene.add(floor);

          const grid = new THREE.GridHelper(100, 70, 0x13bddd, 0x182c48);
          grid.position.y = -0.055; grid.material.transparent = true; grid.material.opacity = 0.28; scene.add(grid);

          // Layered industrial architecture gives the arena a designed sci-fi silhouette.
          const arena = new THREE.Group(); scene.add(arena);
          const wallMat = mat(0x17243b, 0.8, 0.3);
          const neonCyan = mat(0x27dfff, 0.45, 0.22, 0x00bfff, 3.5);
          const neonPink = mat(0xff3eae, 0.4, 0.2, 0xff168f, 3.2);
          function pillar(x,z,h=5) {
            const g = new THREE.Group(); g.position.set(x,h/2,z); arena.add(g);
            const body = new THREE.Mesh(new THREE.CylinderGeometry(.55,.8,h,8,1), wallMat);
            body.castShadow=true; body.receiveShadow=true; g.add(body);
            const band = new THREE.Mesh(new THREE.TorusGeometry(.62,.055,8,32), neonCyan);
            band.rotation.x=Math.PI/2; band.position.y=h*.28; g.add(band);
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.16,8), mat(0x263b59,.8,.25));
            cap.position.y=h/2; g.add(cap);
            const glow = new THREE.PointLight(0x1bdcff, 3, 8); glow.position.y=h*.25; g.add(glow);
          }
          for (const p of [[-13,-13],[-13,0],[-13,13],[13,-13],[13,0],[13,13],[-5,-17],[5,-17]]) pillar(p[0],p[1],4.5+Math.random()*2);
          for(let i=0;i<24;i++){
            const a=i/24*Math.PI*2, r=17;
            const post=new THREE.Mesh(new THREE.BoxGeometry(.16,2.6,.16), i%2?neonPink:neonCyan);
            post.position.set(Math.cos(a)*r,1.3,Math.sin(a)*r); arena.add(post);
          }
          for(let i=0;i<34;i++){
            const x=(Math.random()-.5)*34,z=(Math.random()-.5)*34;
            if(Math.hypot(x,z)<7) continue;
            const shard=new THREE.Mesh(new THREE.DodecahedronGeometry(.35+Math.random()*.55,0),mat(0x1a2943,.7,.27));
            shard.position.set(x,.45,z); shard.rotation.set(Math.random(),Math.random(),Math.random()); shard.castShadow=true; arena.add(shard);
            const stripe=new THREE.Mesh(new THREE.BoxGeometry(.9,.035,.035),i%2?neonPink:neonCyan);
            stripe.position.copy(shard.position); stripe.position.y+=.3; arena.add(stripe);
          }

          const player = new THREE.Group(); scene.add(player); player.position.set(0,0,4);
          const suit = mat(0x243c59,.78,.24), dark = mat(0x091322,.8,.22), visor = mat(0x19dfff,.35,.16,0x00bfff,4);
          const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.43,.7,5,10), suit); torso.position.y=1.15; torso.castShadow=true; player.add(torso);
          const chest = new THREE.Mesh(new THREE.BoxGeometry(.48,.28,.13), visor); chest.position.set(0,1.28,-.39); player.add(chest);
          const head = new THREE.Mesh(new THREE.SphereGeometry(.29,18,14), dark); head.position.y=1.85; head.scale.set(1,1.1,.9); head.castShadow=true; player.add(head);
          const face = new THREE.Mesh(new THREE.BoxGeometry(.36,.11,.08), visor); face.position.set(0,1.88,-.255); player.add(face);
          const shoulderGeo=new THREE.SphereGeometry(.23,12,10);
          for(const s of [-1,1]){
            const shoulder=new THREE.Mesh(shoulderGeo,suit); shoulder.position.set(s*.53,1.48,0); player.add(shoulder);
            const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.48,4,8),dark); arm.position.set(s*.58,1.08,-.02); arm.rotation.z=s*.12; player.add(arm);
            const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.55,4,8),dark); leg.position.set(s*.22,.42,0); player.add(leg);
            const boot=new THREE.Mesh(new THREE.BoxGeometry(.34,.18,.48),suit); boot.position.set(s*.22,.12,-.08); player.add(boot);
          }
          const pack=new THREE.Mesh(new THREE.BoxGeometry(.65,.7,.24),dark); pack.position.set(0,1.3,.36); player.add(pack);
          const packGlow=new THREE.Mesh(new THREE.BoxGeometry(.42,.08,.04),neonPink); packGlow.position.set(0,1.35,.5); player.add(packGlow);

          // Enemy sentries are articulated, multi-part hovering machines rather than primitive placeholders.
          const enemies=[], bolts=[], particles=[];
          const enemyCore=mat(0x64244e,.7,.22,0x7b145e,1.5), enemyArmor=mat(0x28334e,.85,.23), enemyEye=mat(0xff397e,.35,.12,0xff0759,5);
          function makeEnemy(x,z){
            const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
            const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.58,1),enemyCore); core.scale.set(1.15,.82,1); core.castShadow=true; g.add(core);
            const shell=new THREE.Mesh(new THREE.SphereGeometry(.72,16,12,0,Math.PI*2,0,Math.PI*.63),enemyArmor);
            shell.position.y=.13; shell.rotation.x=Math.PI; g.add(shell);
            const eye=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),enemyEye); eye.position.set(0,.12,-.58); g.add(eye);
            const ring=new THREE.Mesh(new THREE.TorusGeometry(.78,.055,8,32),neonPink); ring.rotation.x=Math.PI/2; ring.position.y=-.12; g.add(ring);
            for(let i=0;i<3;i++){
              const arm=new THREE.Mesh(new THREE.CylinderGeometry(.045,.11,.72,8),enemyArmor);
              const a=i*Math.PI*2/3; arm.position.set(Math.cos(a)*.72,-.05,Math.sin(a)*.72); arm.rotation.z=Math.cos(a)*.8; arm.rotation.x=Math.sin(a)*.8; g.add(arm);
              const tip=new THREE.Mesh(new THREE.OctahedronGeometry(.16),neonPink); tip.position.set(Math.cos(a)*1.05,-.12,Math.sin(a)*1.05); g.add(tip);
            }
            const light=new THREE.PointLight(0xff176d,2.5,5); light.position.y=.2; g.add(light);
            enemies.push({group:g,hp:3,speed:1.05+Math.random()*.35,phase:Math.random()*6,hit:0});
          }
          const v=(x,y,z)=>new THREE.Vector3(x,y,z);
          function burst(pos,color=0x2beaff,count=9){
            for(let i=0;i<count;i++){
              const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.045+Math.random()*.06,0),new THREE.MeshBasicMaterial({color,transparent:true}));
              m.position.copy(pos); scene.add(m);
              particles.push({mesh:m,vel:v((Math.random()-.5)*4,Math.random()*3,(Math.random()-.5)*4),life:.5+Math.random()*.45});
            }
          }
          let health=100,score=0,wave=1,playing=false,last=0,spawnClock=0,fireClock=0,dashTime=0,invuln=0;
          const healthEl=document.querySelector('#health'),scoreEl=document.querySelector('#score'),waveEl=document.querySelector('#wave');
          const center=document.querySelector('#center'),gameover=document.querySelector('#gameover'),toast=document.querySelector('#toast');
          const keys={}; let stick={x:0,y:0,active:false}, firing=false;
          addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')firing=true;});
          addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')firing=false;});
          const stickEl=document.querySelector('#stick'),nub=document.querySelector('#nub');
          function stickMove(e){
            const r=stickEl.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
            const dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),len=Math.min(48,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
            stick.x=Math.cos(a)*len/48;stick.y=Math.sin(a)*len/48;nub.style.transform=`translate(${stick.x*36}px,${stick.y*36}px)`;
          }
          stickEl.addEventListener('pointerdown',e=>{stick.active=true;stickEl.setPointerCapture(e.pointerId);stickMove(e);});
          stickEl.addEventListener('pointermove',e=>{if(stick.active)stickMove(e);});
          const resetStick=()=>{stick.active=false;stick.x=stick.y=0;nub.style.transform='translate(0,0)'};
          stickEl.addEventListener('pointerup',resetStick);stickEl.addEventListener('pointercancel',resetStick);
          document.querySelector('#fire').addEventListener('pointerdown',()=>firing=true);
          ['pointerup','pointercancel','pointerleave'].forEach(ev=>document.querySelector('#fire').addEventListener(ev,()=>firing=false));
          document.querySelector('#dash').addEventListener('pointerdown',()=>{if(playing)dashTime=.22;});
          function shoot(){
            const dir=v(0,0,-1); const target=enemies.length?enemies.reduce((a,b)=>player.position.distanceTo(a.group.position)<player.position.distanceTo(b.group.position)?a:b):null;
            if(target){dir.copy(target.group.position).sub(player.position);dir.y=0;dir.normalize();}
            const mesh=new THREE.Mesh(new THREE.SphereGeometry(.105,10,8),new THREE.MeshBasicMaterial({color:0x6ff7ff}));
            mesh.position.copy(player.position).add(v(0,1.35,-.2));scene.add(mesh);
            const glow=new THREE.PointLight(0x31dfff,2,2);mesh.add(glow);
            bolts.push({mesh,vel:dir.multiplyScalar(23),life:1.4});
          }
          function damageEnemy(e){
            e.hp--;e.hit=.12;burst(e.group.position.clone().add(v(0,.2,0)),0xff4aa8,6);
            if(e.hp<=0){burst(e.group.position.clone(),0x38eaff,18);scene.remove(e.group);enemies.splice(enemies.indexOf(e),1);score+=100;scoreEl.textContent=String(score).padStart(4,'0');}
          }
          function endGame(){
            playing=false;document.querySelector('#finalscore').textContent=`FINAL SCORE  ${score}`;
            gameover.style.display='grid';document.querySelector('#mobile').style.display='none';
          }
          function start(){
            enemies.forEach(e=>scene.remove(e.group));enemies.length=0;bolts.forEach(b=>scene.remove(b.mesh));bolts.length=0;
            health=100;score=0;wave=1;spawnClock=0;fireClock=0;player.position.set(0,0,4);
            healthEl.textContent=health;scoreEl.textContent='0000';waveEl.textContent='01';
            center.style.display='none';gameover.style.display='none';document.querySelector('#mobile').style.display='block';playing=true;
            for(let i=0;i<4;i++)makeEnemy((Math.random()-.5)*18,-8-Math.random()*10);
          }
          document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;

          const clock=new THREE.Clock();
          function update(dt){
            if(playing){
              const mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stick.x;
              const mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+stick.y;
              const move=v(mx,0,mz);if(move.length()>1)move.normalize();
              const speed=dashTime>0?17:7.5;dashTime=Math.max(0,dashTime-dt);
              player.position.addScaledVector(move,speed*dt);player.position.x=THREE.MathUtils.clamp(player.position.x,-15,15);player.position.z=THREE.MathUtils.clamp(player.position.z,-15,15);
              if(move.lengthSq()>.02)player.rotation.y=Math.atan2(move.x,-move.z);
              player.position.y=Math.sin(clock.elapsedTime*8)*.035;
              camera.position.lerp(v(player.position.x*.3,4.7,player.position.z+8.4),1-Math.exp(-3*dt));
              camera.lookAt(player.position.x*.35,1.0,player.position.z-3.3);
              fireClock-=dt;if(firing&&fireClock<=0){shoot();fireClock=.19;}
              spawnClock+=dt;if(spawnClock>Math.max(1.2,4-wave*.13)&&enemies.length<Math.min(12,4+wave)){spawnClock=0;makeEnemy((Math.random()-.5)*25,-12-Math.random()*9);}
              if(score>=wave*500){wave++;waveEl.textContent=String(wave).padStart(2,'0');toast.textContent=`WAVE ${wave} // INCOMING`;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,1100);}
              invuln=Math.max(0,invuln-dt);
              for(const e of [...enemies]){
                e.phase+=dt*2;e.group.position.y=1.05+Math.sin(e.phase)*.22;
                e.group.lookAt(player.position.x,1,player.position.z);
                const d=v(player.position.x-e.group.position.x,0,player.position.z-e.group.position.z);
                const dist=d.length();if(dist>1.65)e.group.position.addScaledVector(d.normalize(),e.speed*dt);
                if(dist<1.45&&invuln<=0){health=Math.max(0,health-12);healthEl.textContent=health;invuln=.7;burst(player.position.clone().add(v(0,1,0)),0xff458d,10);if(!health)endGame();}
                e.group.rotation.y+=dt*.5;
              }
              for(let i=bolts.length-1;i>=0;i--){
                const b=bolts[i];b.mesh.position.addScaledVector(b.vel,dt);b.life-=dt;
                const hit=enemies.find(e=>e.group.position.distanceTo(b.mesh.position)<.9);
                if(hit){damageEnemy(hit);b.life=0;}
                if(b.life<=0){scene.remove(b.mesh);bolts.splice(i,1);}
              }
            } else {
              camera.position.x=Math.sin(clock.elapsedTime*.12)*.8;
              camera.lookAt(0,1,-3);
            }
            for(let i=particles.length-1;i>=0;i--){
              const p=particles[i];p.life-=dt;p.mesh.position.addScaledVector(p.vel,dt);p.vel.y-=5*dt;p.mesh.scale.multiplyScalar(.97);
              if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}
            }
            pinkLight.intensity=24+Math.sin(clock.elapsedTime*2)*7;cyanLight.intensity=27+Math.cos(clock.elapsedTime*1.7)*6;
          }
          function animate(){
            requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera);
          }
          animate();
          addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
          EOF

          cat > src/style.css <<'EOF'
          @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap');
          *{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#050713;color:#eafaff;font-family:'Rajdhani',sans-serif;touch-action:none}
          canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
          #hud{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 17px) 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(#050713dd,transparent);pointer-events:none}
          .brand{font:800 19px Orbitron;letter-spacing:2px;color:#f2fbff;text-shadow:0 0 14px #12dfff}.brand b{color:#ff4db7}.brand small{display:block;font:600 9px Rajdhani;letter-spacing:3px;color:#8ca9c7;margin-top:5px}
          .stats{display:flex;gap:18px;font:700 11px Orbitron;color:#91a9c8}.stats span{display:grid;gap:5px;text-align:center}.stats b{font-size:16px;color:#eaffff;text-shadow:0 0 10px #25dfff}
          #center,#gameover{position:absolute;z-index:5;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#07182ccc,#03050de8 70%)}
          .eyebrow{font:600 10px Orbitron;letter-spacing:4px;color:#3deaff}h1{font:900 clamp(48px,13vw,88px)/.92 Orbitron;letter-spacing:2px;margin:18px 0;text-shadow:0 0 28px #04cfff66}h1 em{font-style:normal;color:#ff48b6;text-shadow:0 0 25px #ff249b}#center p{color:#9ab3cb;font-size:18px;margin:4px 0 28px}
          button{font:800 13px Orbitron;letter-spacing:2px;color:#04101c;background:linear-gradient(110deg,#36eaff,#a4faff);border:0;padding:16px 30px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);box-shadow:0 0 24px #15cfff66}
          .hint{margin-top:22px;color:#6d88a6;font:600 9px Orbitron;letter-spacing:1.4px}
          #crosshair{position:absolute;z-index:2;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);opacity:.55;pointer-events:none}#crosshair i{position:absolute;inset:0;border:1px solid #6ff5ff;border-radius:50%}#crosshair b{position:absolute;width:3px;height:3px;background:#fff;left:9px;top:9px;border-radius:50%}
          #mobile{display:none;position:absolute;z-index:4;inset:auto 0 calc(env(safe-area-inset-bottom) + 22px);height:140px;pointer-events:none}
          #stick{position:absolute;left:25px;bottom:0;width:116px;height:116px;border:1px solid #53dfff88;border-radius:50%;background:#0b244966;box-shadow:inset 0 0 22px #20dfff22;pointer-events:auto;touch-action:none}
          #nub{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:linear-gradient(145deg,#76f7ff,#1684b6);box-shadow:0 0 22px #20dfff99;border:1px solid #c6ffff}
          #fire,#dash{position:absolute;right:25px;bottom:8px;width:82px;height:82px;border-radius:50%;clip-path:none;padding:0;pointer-events:auto;touch-action:none;background:radial-gradient(circle,#ff83d1,#bd1d78);color:white;border:2px solid #ffb4e2;box-shadow:0 0 25px #ff2fa788;font-size:11px}
          #dash{right:118px;bottom:2px;width:58px;height:58px;background:radial-gradient(circle,#63efff,#0875a7);border:1px solid #a9faff;font-size:9px}
          #toast{position:absolute;z-index:3;top:24%;width:100%;text-align:center;font:800 18px Orbitron;color:#ff5bbd;text-shadow:0 0 18px #ff249b;opacity:0;transition:opacity .2s;pointer-events:none}
          #gameover{display:none}#gameover h2{font:900 35px Orbitron;color:#ff54ad;text-shadow:0 0 20px #ff249b}#gameover p{font:700 16px Orbitron;color:#b5cce0;margin:4px 0 28px}
          @media(min-width:800px){#mobile{height:150px}#stick{left:42px}#fire{right:42px}#dash{right:145px}}
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.neonrift.game",
            "appName": "Neon Rift",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Install and build web assets
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build installable Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Rift-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
